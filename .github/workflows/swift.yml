name: Avenue CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - '*'
      
defaults:
  run:
    shell: zsh --login --errexit --pipefail {0}
    
env:
  NSUnbufferedIO: YES
  
jobs:
  mac:
    name: Build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build Avenue GPX Viewer
      run: >
            xcodebuild 
            -project "Avenue.xcodeproj" 
            -scheme "Avenue" 
            -destination "generic/platform=macOS" 
            clean build
