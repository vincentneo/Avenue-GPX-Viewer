name: Avenue CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - '*'

jobs:
  mac:
    name: Build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build Avenue GPX Viewer
      run: |
            set -o pipefail
            env NSUnbufferedIO=YES xcodebuild \
              -project "Avenue.xcodeproj" \
              -scheme "Avenue" \
              -destination "generic/platform=macOS" \
              clean build 2>&1 | tee xcodebuild.log | xcpretty
